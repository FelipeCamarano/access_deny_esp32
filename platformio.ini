; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; v6.9.0 (set/2024) foi tentada pra contornar o bloqueio de deauth cru do IDF
; novo, mas o toolchain GCC dessa versao falha no Windows com PATH grande
; ("CreateProcess: No such file or directory"). Revertido pro toolchain
; LLVM mais novo, que builda sem problema -- ver diagrams/99_ideias_futuras.md
; e o DeauthFrameBuilder pro plano B (disassociation em vez de deauth).
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
monitor_echo = yes

; Teste do Metodo 1 (override via linker) pro bloqueio de deauth cru da SDK --
; ver src/sanity_check_override.cpp e diagrams/10_investigacao_deauth_blob.md.
; -zmuldefs permite multipla definicao do mesmo simbolo no link, pra tentar
; deixar nossa ieee80211_raw_frame_sanity_check() ganhar da versao da SDK.
build_flags =
    -Wl,-zmuldefs

lib_deps =
    h2zero/NimBLE-Arduino
    bblanchon/ArduinoJson@^7
